[package]
name = "churros-software"
version = "1.2.0"
edition = "2024"

[package.metadata.churros]
# Tienda de paquetes propia: pacman, flatpak y AUR.
deploy = true

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_4"] }
churros-services = { path = "../services" }
gio = "0.22.8"
glib = "0.22.8"
gtk = { version = "0.11.4", package = "gtk4", features = ["v4_22"] }
serde_json = "1.0"
