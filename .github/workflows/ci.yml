name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck and gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck gettext

      - name: Run checks
        run: ./churros check

  arm64:
    name: Rust ARM64 compatibility
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install ARM64 target
        run: rustup target add aarch64-unknown-linux-gnu

      - name: cargo check -p churros-services (ARM64)
        run: cargo check -p churros-services --manifest-path rust/Cargo.toml --target aarch64-unknown-linux-gnu
