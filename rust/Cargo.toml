[workspace]
resolver = "2"
members = ["churros-welcome", "churros-tour", "preferences", "services", "popups", "control-center", "software"]

[workspace.package]
version = "1.2.0"
edition = "2021"
license = "GPL-3.0-only"

[profile.release]
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
opt-level = 3
