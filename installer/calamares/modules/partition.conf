---
efiSystemPartition: "/boot/efi"

userSwapChoices:
  - none
  - small
  - suspend
  - file

# Use GPT for automatic "Erase disk" layouts in both firmware modes.
# BIOS + GRUB needs a BIOS Boot Partition on GPT; UEFI uses the ESP below.
defaultPartitionTableType: gpt
defaultFileSystemType: "btrfs"
availableFileSystemTypes:
  - btrfs
  - ext4
# Add both the BIOS Boot Partition and EFI System Partition to autogenerated
# layouts, so the installed GPT disk can boot in either firmware mode.
createHybridBootloaderLayout: true

allowManualPartitioning: true
