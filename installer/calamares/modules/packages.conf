---
backend: pacman

skip_if_no_internet: false
update_db: true
ignore_update_db_error: true
update_system: false

pacman:
  num_retries: 3
  disable_download_timeout: true
  needed_only: true

operations:
  - try_remove:
      - archinstall
      - clonezilla
      - gpm
      - irssi
      - lynx
      - mc
      - testdisk
      - wvdial
