name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck and gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck gettext

      - name: Run checks
        run: ./churros check
