# Cursor por software solo en GPUs virtuales: con virtio/qxl/vmwgfx/bochs/cirrus
# el cursor por hardware de Xorg (modesetting) puede quedar invisible.
# OutputClass (no un "Device" con Driver "modesetting") para no forzar el
# driver ni el SWcursor en hardware real ni romper NVIDIA (netinstall lo ofrece).
Section "OutputClass"
    Identifier "churros-vm-swcursor"
    MatchDriver "virtio_gpu|virtio-gpu|qxl|vmwgfx|vboxvideo|bochs|bochs-drm|cirrus|cirrus-qemu|hyperv_drm"
    Option "SWcursor" "on"
EndSection
