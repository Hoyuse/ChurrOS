name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck and gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck gettext

      - name: Run checks
        run: ./churros check

  test:
    name: Tests Rust
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo test -p churros-services
        run: cargo test -p churros-services --manifest-path rust/Cargo.toml
