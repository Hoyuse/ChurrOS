name: Rust

# La CI de ./churros (ci.yml) solo compila churros-services, porque es el
# único crate sin dependencias de GTK. Aquí se compila y se prueba el
# workspace completo: hasta ahora un error en welcome, settings, control
# center, popups o tour solo aparecía al construir la ISO.
#
# gtk4-rs 0.11 pide GTK >= 4.22 y libadwaita-rs 0.9 pide libadwaita >= 1.9.
# Ubuntu no llega a esas versiones, así que el job usa la imagen del
# Containerfile (Arch) y el mismo comando que en local: ./churros rust.
#
# La imagen se construye en cada ejecución, sin caché de capas, y además una
# vez por semana: Arch es rolling, y si un cambio de paquetes rompe el
# Containerfile tiene que fallar aquí y no en la máquina de quien construye.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apps:
    name: Build and test apps (Containerfile)
    runs-on: ubuntu-latest

    env:
      # El runner trae podman y docker; docker corre sin sudo para el usuario
      # del runner.
      CHURROS_CONTAINER_ENGINE: docker

    steps:
      - uses: actions/checkout@v7

      # ./churros rust compila en rust/target/container (lo monta en el
      # contenedor con el UID del runner).
      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: rust/target/container
          key: rust-container-${{ hashFiles('Containerfile', 'rust/Cargo.lock') }}
          restore-keys: rust-container-

      - name: Build container image
        run: |
          source scripts/lib/container.sh
          container_engine_init
          container_ensure_image

      # Las mismas herramientas que comprueba el pre-flight de build.sh, más
      # makepkg y node: ./churros build --container falla si falta alguna.
      - name: ISO build tools present in the image
        run: |
          source scripts/lib/container.sh
          container_engine_init
          container_run -- bash -c '
            for tool in mkarchiso mksquashfs xorriso grub-mkstandalone mkfs.fat mcopy mmd \
                        makepkg repo-add cargo node python3; do
              command -v "$tool" >/dev/null || { echo "falta $tool en la imagen"; exit 1; }
            done
            echo "herramientas de build presentes"'

      # build + test + clippy del workspace. clippy no falla el job por avisos:
      # el workspace arrastra avisos previos.
      - name: ./churros rust
        run: ./churros rust
