# ChurrOS XFCE — Picom Compositor Configuration
backend = "glx";
# glx-no-stencil = true; # deprecated in newer picom
glx-copy-from-front = false;
vsync = true;

# Shadows
shadow = true;
shadow-radius = 16;
shadow-offset-x = -16;
shadow-offset-y = -16;
shadow-opacity = 0.45;
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g ?= 'Notify-osd'",
    "class_g = 'Cairo-clock'",
    "_GTK_FRAME_EXTENTS@:c"
];

# Fading
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 6;

# Blur (glassmorphism / vidrio esmerilado) — faltaba, por eso XFCE no tenía glass
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@:c"
];

# Corners & Transparency
corner-radius = 10;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

# Opacity rules
inactive-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

wintypes:
{
    tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; full-shadow = false; };
    dock = { shadow = false; clip-shadow-above = true; };
    dnd = { shadow = false; };
    popup_menu = { opacity = 0.98; };
    dropdown_menu = { opacity = 0.98; };
};
