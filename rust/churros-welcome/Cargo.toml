[package]
name = "churros-welcome"
version = "0.1.0"
edition = "2024"

[package.metadata.churros]
# Port completo: build-rust.sh despliega el binario en la ISO.
deploy = true

[dependencies]
adw = { version = "0.9.2", package = "libadwaita" }
churros-services = { path = "../services" }
gio = "0.22.8"
glib = "0.22.8"
gtk = { version = "0.11.4", package = "gtk4", features = ["v4_22"] }
